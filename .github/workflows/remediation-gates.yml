name: Remediation Required Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-spec-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/lint_spec_manifest.py
      - run: python scripts/lint_spec_manifest.py --selftest

  acceptance-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python qa-backend/tests_final_acceptance.py --validate-only

  unit-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python scripts/check_project.py

  mini-runtime-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir numpy rank-bm25
      - run: python scripts/build_mini_runtime.py --verify
      - run: python scripts/verify_mini_runtime.py
      - run: python qa-backend/tests_remediation_phase00.py

  critical-failure-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml
      - run: cd qa-backend && python run_all_tests.py --suite budget_tk08 degraded_tk10 citation_tk12

  synthetic-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: cd qa-backend && python tests_synthetic_tk20.py

  phase01-stable-evidence-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir numpy fastapi httpx sse-starlette pydantic rank-bm25 jieba pyyaml
      - run: python qa-backend/tests_remediation_phase01.py
      - run: python scripts/run_phase01_benchmark.py --output /tmp/phase01_retrieval_benchmark.json
      - run: python scripts/build_mini_runtime.py --verify

  phase02-citation-claim-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml
      - run: python qa-backend/tests_remediation_phase02.py

  phase03-retrieval-evidence-package:
    # Phase 03 (RT-030..039): pool/reserves/rerank/policy/selection/chunk
    # route/typed EvidencePackage/generator allowlist + the committed
    # deterministic retrieval-quality benchmark vs the ea6a614 baseline
    # semantics (top-25 truncation, 300-char excerpts, no rerank).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml
      - run: python qa-backend/tests_remediation_phase03.py
      - run: python qa-backend/tests_benchmark_phase03.py

  phase04-query-integrity-agentic-orchestration:
    # Phase 04 (RT-040..049): claim-level conversation premises,
    # semantic rewrite integrity, canonical FAST/RESEARCH orchestration,
    # bounded document workers/cache, Ledger/Grader, gaps and stopping.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml
      - run: python qa-backend/tests_remediation_phase04.py
      - run: python qa-backend/tests_benchmark_phase04.py

  phase05-runtime-safety-degradation:
    # Phase 05 (RT-050..055): request-aware degradation, request-scoped
    # cancellation/deadlines/retries, bounded admission, actual-API state
    # isolation stress, and privacy-safe retained Trace.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml
      - run: python qa-backend/tests_remediation_phase05.py
      - run: python qa-backend/tests_benchmark_phase05.py

  phase06-entity-resolution-v2:
    # Phase 06 (RT-060..075): transactional identity control plane,
    # immutable serving snapshot, constrained resolver, migration and shadow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml
      - run: python qa-backend/tests_remediation_phase06.py
      - run: python qa-backend/tests_benchmark_phase06.py
      - run: python qa-backend/tests_er_v2.py

  phase07-graph-serving-relation-aware-retrieval:
    # Phase 07 (RT-080..087): versioned relation ontology, snapshot-locked
    # semantic edge extraction, immutable GraphSnapshot bound to the global
    # manifest, relation-aware retriever (direction/time/grounding/hub),
    # independent relation policy gate, partial activation profile,
    # shadow + honest activation gate, locked relation benchmark.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml
      - run: python qa-backend/tests_remediation_phase07.py
      - run: python qa-backend/tests_benchmark_phase07.py

  phase08-api-ui-trace-replay:
    # Phase 08 (RT-090..094): unified terminal contract, exact-span
    # ReferenceCards, truthful replay fidelity, Human Review/holdout
    # isolation, and server-authorized retained Trace audit views.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml
      - run: python qa-backend/tests_remediation_phase08.py

  phase09-benchmarks-ci-release-gates:
    # Phase09 (RT-100..108): locked retrieval/answer/multi-document/ER
    # benchmarks, real server+orchestrator E2E, critical failure injection,
    # provenance validation, and the single fail-closed release evaluator.
    #
    # CI identity contract (D7 hardening, pull_request merge-ref semantics):
    # - authority subject = the exact PR head commit; owner proofs bind to it
    #   via evaluated_git_sha, and PHASE09_AUTHORITY_SUBJECT_SHA is exported
    #   from the trusted GitHub event context only (never repo content);
    # - the GitHub-generated merge ref is identity-checked (parents exactly
    #   [event base, event head]) and the canonical release gate runs on it,
    #   so merge-with-main integration stays genuinely tested and a merge
    #   result failure can never be masked by a head-only pass;
    # - the gate ALSO runs on an exact-head checkout whose HEAD is asserted
    #   equal to the event head sha BEFORE any secret-bearing step, and the
    #   strict machine evidence chain is validated there;
    # - the job is green only if both gate executions really succeed; a
    #   fail-closed gate stays red, and the expected-block verifiers prove
    #   the red reason is genuine (never RT075 identity/transport noise).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml
      - name: Merge-ref identity proof (parents == event base+head)
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The event's base.sha is the base recorded when the PR was
            # opened/last synchronized — for a PR that is BEHIND its base,
            # the merge ref's parent1 is the CURRENT base tip, which is a
            # descendant of base.sha.  The identity contract therefore
            # requires base.sha to be an ANCESTOR of merge parent1 (the
            # claimed base is genuinely contained in the integrated base
            # lineage), while parent2 must equal the event head exactly.
            git merge-base --is-ancestor "$EVENT_BASE_SHA" "$(git rev-parse HEAD^1)" \
              || { echo "::error::event base sha not contained in merge-ref base lineage (identity contract)"; exit 1; }
            [ "$(git rev-parse HEAD^2)" = "$EVENT_HEAD_SHA" ] \
              || { echo "::error::merge-ref parent2 != event head sha (identity contract)"; exit 1; }
            git merge-base --is-ancestor "$EVENT_HEAD_SHA" HEAD \
              || { echo "::error::event head not contained in merge ref"; exit 1; }
            SUBJECT="$EVENT_HEAD_SHA"
          else
            [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] \
              || { echo "::error::checkout HEAD != github.sha (identity contract)"; exit 1; }
            SUBJECT="$EXPECTED_SHA"
          fi
          echo "PHASE09_AUTHORITY_SUBJECT_SHA=$SUBJECT" >> "$GITHUB_ENV"
          echo "authority subject: $SUBJECT (merge-ref checkout $(git rev-parse HEAD))"
      - name: Generic Phase09 product repair regressions (merge result)
        run: python qa-backend/tests_repair_phase09_generic.py
      - name: Execute canonical Phase09 release gate (merge integration result)
        # D7 (P0 closure): genuine RT-101 authority / external-control
        # satisfactions enter ONLY via owner-provisioned secrets (step-
        # scoped: never in GITHUB_ENV, never echoed).  Unset secrets expand
        # to empty strings and the gate fails closed.  Proofs are evaluated
        # against the authority subject (event head), not the merge ref.
        env:
          PHASE09_RT101_AUTHORITY_PROOF: ${{ secrets.PHASE09_RT101_AUTHORITY_PROOF }}
          PHASE09_RT101_EXPECTED_HOLDOUT_LOCK_SHA256: ${{ secrets.PHASE09_RT101_EXPECTED_HOLDOUT_LOCK_SHA256 }}
          PHASE09_RT101_AUTHORITY_HMAC_KEY: ${{ secrets.PHASE09_RT101_AUTHORITY_HMAC_KEY }}
          PHASE09_EXTERNAL_SATISFACTION_PROOFS: ${{ secrets.PHASE09_EXTERNAL_SATISFACTION_PROOFS }}
          PHASE09_EXTERNAL_SATISFACTION_HMAC_KEY: ${{ secrets.PHASE09_EXTERNAL_SATISFACTION_HMAC_KEY }}
        run: >-
          python scripts/run_phase09_release_gate.py
          --evidence-out qa-backend/phase09_artifacts/phase09_release_evidence.json
          --status-out qa-backend/phase09_artifacts/phase09_ticket_status.json
      - name: Assert intentional fail-closed reason (merge result)
        # Diagnostic only: when the gate is red, prove the red is the
        # genuine RT-101 authority absence and not a code regression or
        # proof transport/identity noise. The job stays red either way.
        if: failure()
        run: python scripts/verify_phase09_expected_block.py --evidence qa-backend/phase09_artifacts/phase09_release_evidence.json
      - name: Exact-head checkout (authority subject identity)
        if: always()
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: phase09-head
          fetch-depth: 0
      - name: Exact-head identity assert (before any secret-bearing step)
        if: always()
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          WANT="${EVENT_HEAD_SHA:-$EXPECTED_SHA}"
          GOT="$(git -C phase09-head rev-parse HEAD)"
          [ "$GOT" = "$WANT" ] \
            || { echo "::error::exact-head checkout HEAD $GOT != event head sha $WANT (identity contract)"; exit 1; }
          echo "exact-head identity verified: $GOT"
      - name: Execute canonical Phase09 release gate (exact head)
        if: always()
        working-directory: phase09-head
        env:
          PHASE09_RT101_AUTHORITY_PROOF: ${{ secrets.PHASE09_RT101_AUTHORITY_PROOF }}
          PHASE09_RT101_EXPECTED_HOLDOUT_LOCK_SHA256: ${{ secrets.PHASE09_RT101_EXPECTED_HOLDOUT_LOCK_SHA256 }}
          PHASE09_RT101_AUTHORITY_HMAC_KEY: ${{ secrets.PHASE09_RT101_AUTHORITY_HMAC_KEY }}
          PHASE09_EXTERNAL_SATISFACTION_PROOFS: ${{ secrets.PHASE09_EXTERNAL_SATISFACTION_PROOFS }}
          PHASE09_EXTERNAL_SATISFACTION_HMAC_KEY: ${{ secrets.PHASE09_EXTERNAL_SATISFACTION_HMAC_KEY }}
        run: >-
          python scripts/run_phase09_release_gate.py
          --evidence-out qa-backend/phase09_artifacts/phase09_release_evidence.json
          --status-out qa-backend/phase09_artifacts/phase09_ticket_status.json
      - name: Assert intentional fail-closed reason (exact head)
        if: failure()
        working-directory: phase09-head
        run: python scripts/verify_phase09_expected_block.py --evidence qa-backend/phase09_artifacts/phase09_release_evidence.json
      - name: Validate Phase09 evidence chain (exact head, strict machine)
        if: always()
        working-directory: phase09-head
        env:
          PHASE09_RT101_AUTHORITY_PROOF: ${{ secrets.PHASE09_RT101_AUTHORITY_PROOF }}
          PHASE09_RT101_EXPECTED_HOLDOUT_LOCK_SHA256: ${{ secrets.PHASE09_RT101_EXPECTED_HOLDOUT_LOCK_SHA256 }}
          PHASE09_RT101_AUTHORITY_HMAC_KEY: ${{ secrets.PHASE09_RT101_AUTHORITY_HMAC_KEY }}
          PHASE09_EXTERNAL_SATISFACTION_PROOFS: ${{ secrets.PHASE09_EXTERNAL_SATISFACTION_PROOFS }}
          PHASE09_EXTERNAL_SATISFACTION_HMAC_KEY: ${{ secrets.PHASE09_EXTERNAL_SATISFACTION_HMAC_KEY }}
        run: >-
          python scripts/validate_phase09_evidence_chain.py
          --release-evidence qa-backend/phase09_artifacts/phase09_release_evidence.json
          --ticket-status qa-backend/phase09_artifacts/phase09_ticket_status.json
          --strict-machine
      - name: Upload Phase09 machine evidence (exact head artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase09-release-evidence
          path: |
            phase09-head/qa-backend/benchmark_phase09_result.json
            phase09-head/qa-backend/phase09_artifacts/*.json
          retention-days: 180

  legacy-index-migration:
    # Phase-02 review blocker C: legacy dataset (no inline record_id) →
    # explicit stable-ID migration (RecordRegistry/SourceIdentityKey) →
    # dataset-pinned RecordIdMap → stable-ID build view → vector/BM25
    # rebuild. Fails closed on missing/invalid maps; never invents IDs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir numpy jieba rank-bm25
      - run: python qa-backend/tests_index_migration.py

  rt029-visual-regression:
    # RT-029.DOD-03: real-browser (Chromium) visual regression on the
    # production frontend — deterministic local fixtures (no live tunnel),
    # desktop + mobile viewports, committed golden screenshots with pixel
    # diff, plus a mutation case proving the harness detects breakage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: CJK fonts for deterministic rendering
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install --no-cache-dir playwright Pillow
      - run: python -m playwright install --with-deps chromium
      - run: python qa-backend/tests_visual_rt029.py
        env:
          TECH_DB_VISUAL_REQUIRED: "1"

  fast-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml
      - run: cd qa-backend && python tests_parity.py

  data-sync-path-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Enforce data-only automation scope
        if: startsWith(github.head_ref, 'automation/data-sync-')
        run: python scripts/verify_data_sync_paths.py --base "origin/${{ github.base_ref }}"
      - name: Non-automation PR
        if: ${{ !startsWith(github.head_ref, 'automation/data-sync-') }}
        run: echo "Standard PR; full remediation gates still apply."
