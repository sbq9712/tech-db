# TK-15 — QA test tiers (Q15/Q31/R11)
# push  : fully mocked LLM (no ZAI key), push-tier suites + spec validator +
#         10-query holdout smoke — runs on every push/PR
# nightly: final_acceptance + mini-index structural eval with real GLM
#         (secrets.ZAI_API_KEY), machine-readable JSON artifacts committed
#         back to the repo
name: QA Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly 07:00 CST = 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qa-backend
    steps:
      - uses: actions/checkout@v4
        with:
          # CI identity contract (D7 hardening): full history is required so
          # the merge-ref parent identity assert (HEAD^1/HEAD^2) and the
          # authority-subject committer-time lookup both resolve.
          fetch-depth: 0
      - name: Resolve proof authority subject (trusted event context only)
        # The subject SHA comes ONLY from the GitHub event context — never
        # from repository content, so PR-authored files cannot re-point the
        # owner-proof binding. In pull_request events the checkout is the
        # merge ref; its parents must be exactly the event base+head commits
        # (integration-safety identity proof), and the authority subject is
        # the event head commit the owner proofs are bound to.
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The event's base.sha is the base recorded when the PR was
            # opened/last synchronized — for a PR that is BEHIND its base,
            # the merge ref's parent1 is the CURRENT base tip, which is a
            # descendant of base.sha.  The identity contract therefore
            # requires base.sha to be an ANCESTOR of merge parent1 (the
            # claimed base is genuinely contained in the integrated base
            # lineage), while parent2 must equal the event head exactly.
            git merge-base --is-ancestor "$EVENT_BASE_SHA" "$(git rev-parse HEAD^1)" \
              || { echo "::error::event base sha not contained in merge-ref base lineage (identity contract)"; exit 1; }
            [ "$(git rev-parse HEAD^2)" = "$EVENT_HEAD_SHA" ] \
              || { echo "::error::merge-ref parent2 != event head sha (identity contract)"; exit 1; }
            git merge-base --is-ancestor "$EVENT_HEAD_SHA" HEAD \
              || { echo "::error::event head not contained in merge ref"; exit 1; }
            SUBJECT="$EVENT_HEAD_SHA"
          else
            [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] \
              || { echo "::error::checkout HEAD != github.sha (identity contract)"; exit 1; }
            SUBJECT="$EXPECTED_SHA"
          fi
          echo "PHASE09_AUTHORITY_SUBJECT_SHA=$SUBJECT" >> "$GITHUB_ENV"
          echo "authority subject: $SUBJECT (checkout $(git rev-parse HEAD))"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        # codex-review B2 P1 fix: complete dependency set — server imports
        # sse-starlette; the BM25 fixture unpickles rank_bm25; tests_ci_tk15
        # parses YAML. The bge-m3 embedding model is NOT needed: tests_parity
        # serves frozen query embeddings (test_fixtures/parity/
        # query_embeddings.json), so no torch/sentence-transformers here.
        run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml
      - name: Push-tier suites (all-mock, no GLM)
        # D7: owner-provisioned external-control satisfactions enter ONLY via
        # these secrets (step-scoped: no other step sees them, never placed
        # in GITHUB_ENV, never echoed). Repo external-state rows claiming
        # satisfaction fail closed here without a verified owner proof; the
        # proofs bind to PHASE09_AUTHORITY_SUBJECT_SHA (event head), not the
        # merge ref, so GitHub's pull_request merge-ref checkout cannot
        # produce a false RT075 identity failure.
        env:
          PHASE09_EXTERNAL_SATISFACTION_PROOFS: ${{ secrets.PHASE09_EXTERNAL_SATISFACTION_PROOFS }}
          PHASE09_EXTERNAL_SATISFACTION_HMAC_KEY: ${{ secrets.PHASE09_EXTERNAL_SATISFACTION_HMAC_KEY }}
        # D7: surface each failing suite + its tail as a check annotation so
        # the failure is diagnosable without an authenticated log download.
        run: |
          python run_all_tests.py --tier push || {
            python - <<'PY'
          import json
          s = json.load(open("test_summary.json"))
          for t in s.get("suites", []):
              if t.get("status") != "PASS":
                  tail = (t.get("tail") or "")[-500:].replace("\n", " | ")
                  print(f"::error::suite {t['tag']} {t['passed']}/{t['passed']+t['failed']} exit={t.get('exit_code')} :: {tail}")
          PY
            exit 1
          }
      - name: Canonical spec manifest lint (T040 — merge gate)
        run: python ../scripts/lint_spec_manifest.py
      - name: Spec validator (must pass in CI)
        run: python verify_spec_manifest.py
      - name: Holdout lock check (fixture immutability)
        # codex-review B2 P2 fix: this step verifies the SHA256 lock + smoke
        # subset integrity — it deliberately runs no retrieval (the anchors
        # reference real-corpus record ids; the real indexes are gitignored).
        # Retrieval evaluation runs in the nightly replay with the real
        # indexes (scripts/nightly_replay.py --retrieval).
        run: python ../scripts/holdout_run.py --mode smoke --check-lock
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-test-summary
          path: qa-backend/test_summary.json

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: qa-backend
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        # nightly = real tier: embedding model + GLM. torch CPU wheel keeps
        # the runner light (no CUDA deps).
        run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml sentence-transformers torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Cache bge-m3 embedding model
        uses: actions/cache@v4
        with:
          path: runtime/models/bge-m3
          key: bge-m3-v1
      - name: Install bge-m3 model (cache miss only)
        run: python ../scripts/runtime_assets.py install --components model
      - name: Nightly final acceptance (real GLM)
        run: python tests_final_acceptance.py
      - name: Mini-index structural eval (real GLM)
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python ../scripts/nightly_eval.py --n 5
      - name: Nightly summary (all tiers)
        run: python run_all_tests.py --tier all
      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-summary
          path: |
            qa-backend/test_summary.json
            qa-backend/test_fixtures/gate2_report.json
            qa-backend/test_fixtures/nightly/eval_report.json
          retention-days: 180
      - name: Commit artifacts back
        if: always()
        run: |
          git config user.name "qa-nightly-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- test_summary.json && [ ! -f /tmp/changed ]; then
            echo "no artifact changes"
          fi
          git add test_summary.json test_fixtures/gate2_report.json test_fixtures/nightly/eval_report.json 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore(nightly): QA test artifacts $(date -u +%F)"
          git push
