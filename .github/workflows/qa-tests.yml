# TK-15 — QA test tiers (Q15/Q31/R11)
# push  : fully mocked LLM (no ZAI key), push-tier suites + spec validator +
#         10-query holdout smoke — runs on every push/PR
# nightly: final_acceptance + mini-index structural eval with real GLM
#         (secrets.ZAI_API_KEY), machine-readable JSON artifacts committed
#         back to the repo
name: QA Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly 07:00 CST = 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qa-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        # codex-review B2 P1 fix: complete dependency set — server imports
        # sse-starlette; the BM25 fixture unpickles rank_bm25; tests_ci_tk15
        # parses YAML. The bge-m3 embedding model is NOT needed: tests_parity
        # serves frozen query embeddings (test_fixtures/parity/
        # query_embeddings.json), so no torch/sentence-transformers here.
        run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml
      - name: Push-tier suites (all-mock, no GLM)
        run: python run_all_tests.py --tier push
      - name: Spec validator (must pass in CI)
        run: python verify_spec_manifest.py
      - name: Holdout lock check (fixture immutability)
        # codex-review B2 P2 fix: this step verifies the SHA256 lock + smoke
        # subset integrity — it deliberately runs no retrieval (the anchors
        # reference real-corpus record ids; the real indexes are gitignored).
        # Retrieval evaluation runs in the nightly replay with the real
        # indexes (scripts/nightly_replay.py --retrieval).
        run: python ../scripts/holdout_run.py --mode smoke --check-lock
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-test-summary
          path: qa-backend/test_summary.json

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: qa-backend
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        # nightly = real tier: embedding model + GLM. torch CPU wheel keeps
        # the runner light (no CUDA deps).
        run: pip install --no-cache-dir fastapi uvicorn numpy jieba pydantic httpx sse-starlette rank-bm25 pyyaml sentence-transformers torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Cache bge-m3 embedding model
        uses: actions/cache@v4
        with:
          path: runtime/models/bge-m3
          key: bge-m3-v1
      - name: Install bge-m3 model (cache miss only)
        run: python ../scripts/runtime_assets.py install --components model
      - name: Nightly final acceptance (real GLM)
        run: python tests_final_acceptance.py
      - name: Mini-index structural eval (real GLM)
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python ../scripts/nightly_eval.py --n 5
      - name: Nightly summary (all tiers)
        run: python run_all_tests.py --tier all
      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-summary
          path: |
            qa-backend/test_summary.json
            qa-backend/test_fixtures/gate2_report.json
            qa-backend/test_fixtures/nightly/eval_report.json
      - name: Commit artifacts back
        if: always()
        run: |
          git config user.name "qa-nightly-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- test_summary.json && [ ! -f /tmp/changed ]; then
            echo "no artifact changes"
          fi
          git add test_summary.json test_fixtures/gate2_report.json test_fixtures/nightly/eval_report.json 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore(nightly): QA test artifacts $(date -u +%F)"
          git push
