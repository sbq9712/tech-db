name: Compact legacy Git history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compact-history.yml

permissions:
  contents: write

concurrency:
  group: compact-main-history
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compact pre-cutoff history and purge runtime assets
        shell: bash
        env:
          CUTOFF: "2026-07-27T14:18:59Z"
        run: |
          set -euo pipefail
          OLD_TIP="$(git rev-parse HEAD)"
          OLD_TREE="$(git rev-parse HEAD^{tree})"
          CURRENT_COUNT="$(git rev-list --count HEAD)"
          RUNTIME_PATTERN='^data/lightrag/(bm25_index|graph-export|jieba_custom_dict|vector_index)'

          if [ "$CURRENT_COUNT" -le 30 ]; then
            found=0
            for commit in $(git rev-list HEAD); do
              if git ls-tree -r --name-only "$commit" | grep -Eq "$RUNTIME_PATTERN"; then
                found=1
                break
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "History is already compact and runtime assets are absent."
              exit 0
            fi
          fi

          test "$(git rev-list --first-parent --since="$CUTOFF" --merges HEAD | wc -l)" -eq 0
          FIRST_RECENT="$(git rev-list --first-parent --reverse --since="$CUTOFF" HEAD | head -1)"
          test -n "$FIRST_RECENT"
          BOUNDARY="$(git rev-parse "$FIRST_RECENT^")"
          INDEX_DIR="$(mktemp -d)"
          INDEX_FILE="$INDEX_DIR/index"
          NEW_PARENT=""

          for commit in "$BOUNDARY" $(git rev-list --first-parent --reverse --since="$CUTOFF" "$OLD_TIP"); do
            GIT_INDEX_FILE="$INDEX_FILE" git read-tree "$commit^{tree}"
            GIT_INDEX_FILE="$INDEX_FILE" git update-index --force-remove -- \
              data/lightrag/bm25_index.pkl.gz \
              data/lightrag/graph-export-backup-old.json \
              data/lightrag/graph-export.json \
              data/lightrag/jieba_custom_dict.txt \
              data/lightrag/vector_index_v2.pkl.gz
            FILTERED_TREE="$(GIT_INDEX_FILE="$INDEX_FILE" git write-tree)"

            if [ -z "$NEW_PARENT" ]; then
              COMMIT_MESSAGE='chore: compact history before 2026-07-27'
              AUTHOR_NAME='OpenAI Codex'
              AUTHOR_EMAIL='codex@openai.com'
              AUTHOR_DATE="$(git show -s --format=%cI "$commit")"
              COMMITTER_NAME="$AUTHOR_NAME"
              COMMITTER_EMAIL="$AUTHOR_EMAIL"
              COMMITTER_DATE="$AUTHOR_DATE"
            else
              COMMIT_MESSAGE="$(git show -s --format=%B "$commit")"
              AUTHOR_NAME="$(git show -s --format=%an "$commit")"
              AUTHOR_EMAIL="$(git show -s --format=%ae "$commit")"
              AUTHOR_DATE="$(git show -s --format=%aI "$commit")"
              COMMITTER_NAME="$(git show -s --format=%cn "$commit")"
              COMMITTER_EMAIL="$(git show -s --format=%ce "$commit")"
              COMMITTER_DATE="$(git show -s --format=%cI "$commit")"
            fi

            if [ -n "$NEW_PARENT" ]; then
              NEW_PARENT="$(printf '%s\n' "$COMMIT_MESSAGE" | \
                GIT_AUTHOR_NAME="$AUTHOR_NAME" GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL" GIT_AUTHOR_DATE="$AUTHOR_DATE" \
                GIT_COMMITTER_NAME="$COMMITTER_NAME" GIT_COMMITTER_EMAIL="$COMMITTER_EMAIL" GIT_COMMITTER_DATE="$COMMITTER_DATE" \
                git commit-tree "$FILTERED_TREE" -p "$NEW_PARENT")"
            else
              NEW_PARENT="$(printf '%s\n' "$COMMIT_MESSAGE" | \
                GIT_AUTHOR_NAME="$AUTHOR_NAME" GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL" GIT_AUTHOR_DATE="$AUTHOR_DATE" \
                GIT_COMMITTER_NAME="$COMMITTER_NAME" GIT_COMMITTER_EMAIL="$COMMITTER_EMAIL" GIT_COMMITTER_DATE="$COMMITTER_DATE" \
                git commit-tree "$FILTERED_TREE")"
            fi
          done

          NEW_TIP="$NEW_PARENT"
          test "$(git rev-parse "$NEW_TIP^{tree}")" = "$OLD_TREE"
          test "$(git rev-list --count "$NEW_TIP")" -le 30
          for commit in $(git rev-list "$NEW_TIP"); do
            if git ls-tree -r --name-only "$commit" | grep -Eq "$RUNTIME_PATTERN"; then
              echo "Runtime asset remains reachable from $commit" >&2
              exit 1
            fi
          done

          git push --force-with-lease="refs/heads/main:$OLD_TIP" origin "$NEW_TIP:refs/heads/main"
          git tag -f runtime-v1 "$NEW_TIP"
          git push --force origin refs/tags/runtime-v1
          echo "Compacted main from $CURRENT_COUNT to $(git rev-list --count "$NEW_TIP") commits."
