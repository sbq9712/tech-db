# tech-db auto-sync pipeline: every 4 hours
# Checks source repos for new data → classify → score → summarize → cluster → push
name: Auto-Sync Pipeline

on:
  schedule:
    # Every 4 hours at XX:00 (UTC = CST-8)
    # 22:00 UTC = 06:00 CST, 02:00 UTC = 10:00 CST, etc.
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allow manual trigger

# 2026-08-16 fix: runs 146-155 were all cancelled — the 45-min timeout killed
# the pipeline mid-summarization (LLM backlog since Aug 13), so nothing was
# ever pushed and the site data froze at Aug 12. Raise to 120 min and never
# let overlapping scheduled runs stack up (they would compete for the shared
# ZAI quota and re-run the same backlog).
concurrency:
  group: auto-sync-pipeline
  cancel-in-progress: true

permissions:
  contents: write

env:
  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  PIPELINE_MAX_DAYS: "7"
  # Indexes (BM25/vector/graph) are local-only — they need the bge-m3 model
  # and existing index state that CI can't persist. CI handles data pipeline
  # only; local machine handles index building via scripts/sync_local.sh.
  SKIP_INDEX_BUILD: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir sentence-transformers numpy deep-translator
          python -c "import sentence_transformers; print('ST OK')"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: bge-m3-model-v1

      - name: Rebuild lite JSON from shards
        run: |
          python3 scripts/rebuild_lite_from_shards.py

      - name: Run pipeline
        run: |
          export HF_HUB_OFFLINE=0
          export TRANSFORMERS_OFFLINE=0
          python3 auto_pipeline.py 2>&1
